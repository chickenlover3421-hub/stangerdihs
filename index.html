<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio • Vision‑Powered (OpenAI + Gemini)</title>
    <script type="importmap">
        { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-gradient: linear-gradient(145deg, #f9fafc 0%, #f1f4f9 100%);
            --sidebar-bg: rgba(255,255,255,0.75);
            --glass-border: rgba(255,255,255,0.5);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.05);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent-gemini: #4285f4;
            --accent-groq: #9d4edd;
            --accent-sambanova: #f97316;
            --accent-openai: #10a37f;
            --border-light: #e2e8f0;
            --user-bubble: #3b82f6;
            --ai-bubble: #ffffff;
            --hover-bg: rgba(0,0,0,0.03);
            --code-bg: #0f172a;
        }
        body.dark-mode {
            --bg-gradient: linear-gradient(145deg, #0b1120 0%, #1a2234 100%);
            --sidebar-bg: rgba(30,41,59,0.85);
            --glass-border: rgba(255,255,255,0.08);
            --glass-shadow: 0 8px 32px rgba(0,0,0,0.4);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-light: #334155;
            --user-bubble: #2563eb;
            --ai-bubble: #1e293b;
            --hover-bg: rgba(255,255,255,0.05);
            --code-bg: #0f172a;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
            backdrop-filter: blur(2px);
            transition: background 0.3s, color 0.2s;
        }
        .sidebar {
            width: 360px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            height: 100vh;
        }
        .logo {
            font-weight: 700;
            font-size: 1.4rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--accent-openai);
            letter-spacing: -0.02em;
        }
        .logo span { font-size: 1.8rem; }
        .ai-model-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .model-btn {
            padding: 14px 16px;
            border-radius: 20px;
            border: 2px solid transparent;
            background: rgba(255,255,255,0.05);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 12px;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .model-btn:hover {
            transform: translateY(-2px);
            background: rgba(255,255,255,0.15);
            border-color: currentColor;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .model-btn.active {
            border-color: currentColor;
            font-weight: 600;
            background: rgba(255,255,255,0.2);
        }
        .model-btn.gemini   { color: var(--accent-gemini); }
        .model-btn.groq     { color: var(--accent-groq); }
        .model-btn.sambanova { color: var(--accent-sambanova); }
        .model-btn.openai    { color: var(--accent-openai); }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
        }
        select, input, button {
            padding: 12px 14px;
            border-radius: 16px;
            border: 1px solid var(--border-light);
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: 0.15s;
            backdrop-filter: blur(4px);
        }
        select:hover, input:hover, button:hover {
            border-color: currentColor;
            background: rgba(255,255,255,0.15);
        }
        select option { background: var(--sidebar-bg); color: var(--text-primary); }
        .api-key-input { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; }

        .session-list-container {
            flex: 1;
            border-top: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            margin: 10px 0;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .session-item {
            padding: 12px 14px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-primary);
            transition: 0.15s;
        }
        .session-item:hover {
            background: var(--hover-bg);
            border-color: var(--border-light);
        }
        .session-item.active {
            background: var(--hover-bg);
            border-color: currentColor;
            color: currentColor;
            font-weight: 600;
        }
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: transparent;
        }
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 30px 10%;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }
        .message {
            display: flex;
            flex-direction: column;
            max-width: 75%;
            padding: 18px 22px;
            border-radius: 28px;
            line-height: 1.6;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .message.user {
            align-self: flex-end;
            background: var(--user-bubble);
            color: white;
            border-bottom-right-radius: 8px;
        }
        .message.ai {
            align-self: flex-start;
            background: var(--ai-bubble);
            color: var(--text-primary);
            border-bottom-left-radius: 8px;
            border: 1px solid var(--border-light);
        }
        .message.ai.gemini    { border-left: 6px solid var(--accent-gemini); }
        .message.ai.groq      { border-left: 6px solid var(--accent-groq); }
        .message.ai.sambanova { border-left: 6px solid var(--accent-sambanova); }
        .message.ai.openai    { border-left: 6px solid var(--accent-openai); }
        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .ai-icon {
            width: 28px;
            height: 28px;
            border-radius: 30%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            background: currentColor;
            color: white;
        }
        .media-preview {
            max-width: 100%;
            max-height: 260px;
            border-radius: 20px;
            margin: 12px 0 8px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        pre {
            background: var(--code-bg);
            color: #e2e8f0;
            padding: 16px;
            border-radius: 16px;
            overflow-x: auto;
            font-family: 'Fira Code', monospace;
            margin: 10px 0;
        }
        code {
            font-family: 'Fira Code', monospace;
            background: rgba(0,0,0,0.2);
            padding: 3px 6px;
            border-radius: 6px;
        }
        .input-area {
            padding: 24px 10%;
            border-top: 1px solid var(--border-light);
            background: var(--sidebar-bg);
            backdrop-filter: blur(12px);
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .input-area input[type="text"] {
            flex: 1;
            padding: 16px 20px;
            border-radius: 40px;
            border: 1px solid var(--border-light);
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            min-height: 56px;
        }
        .input-area input[type="text"]:focus {
            border-color: currentColor;
            box-shadow: 0 0 0 3px rgba(66,133,244,0.2);
        }
        .upload-btn {
            padding: 12px 18px;
            border-radius: 40px;
            border: 1px solid var(--border-light);
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .upload-btn:hover {
            background: var(--hover-bg);
            transform: scale(1.02);
        }
        .send-btn {
            padding: 14px 28px;
            border-radius: 40px;
            border: none;
            background: currentColor;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.2s;
            box-shadow: 0 6px 14px rgba(0,0,0,0.1);
        }
        .send-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .file-indicator {
            font-size: 0.85rem;
            color: var(--accent-openai);
            padding: 6px 14px;
            background: var(--sidebar-bg);
            border-radius: 40px;
            display: none;
            backdrop-filter: blur(4px);
        }
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 0;
        }
        .typing-indicator span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator.gemini span    { background: var(--accent-gemini); }
        .typing-indicator.groq span      { background: var(--accent-groq); }
        .typing-indicator.sambanova span { background: var(--accent-sambanova); }
        .typing-indicator.openai span    { background: var(--accent-openai); }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 12px; }
    </style>
</head>

<script type="module">
    // --- global functions for onclick ---
    window.switchAI = switchAI;
    window.handleGenerationChange = handleGenerationChange;
    window.toggleDarkMode = toggleDarkMode;
    window.exportAllChats = exportAllChats;
    window.importAllChats = importAllChats;
    window.sendMessage = sendMessage;
    window.handleEnter = handleEnter;
    window.handleFileSelect = handleFileSelect;

    // --- state ---
    let currentAI = 'openai';
    let sessions = [];
    let currentSessionId = null;
    let currentFileBase64 = null;
    let currentFileType = null;
    let currentFileName = null;

    window.onload = function() {
        startNewChat();
        loadAPIKeys();
        updatePrimaryButtonColor();
        // set default model selections
        document.getElementById('openaiModelSelect').value = 'gpt-4o';
        document.getElementById('geminiModelSelect').value = 'gemini-1.5-flash';
        document.getElementById('sambanovaModelSelect').value = 'Meta-Llama-3.1-70B-Instruct';
        document.getElementById('groqModelSelect').value = 'llama-3.3-70b-versatile';
    };

    function switchAI(aiModel) {
        currentAI = aiModel;
        document.querySelectorAll('.model-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.model-btn.${aiModel}`).classList.add('active');
        updatePrimaryButtonColor();
    }
    function updatePrimaryButtonColor() {
        const btn = document.querySelector('.send-btn');
        const colors = {
            openai: 'var(--accent-openai)',
            gemini: 'var(--accent-gemini)',
            sambanova: 'var(--accent-sambanova)',
            groq: 'var(--accent-groq)'
        };
        btn.style.backgroundColor = colors[currentAI] || 'var(--accent-openai)';
    }

    function loadAPIKeys() {
        ['openai','gemini','sambanova','groq'].forEach(id => {
            const saved = localStorage.getItem(id+'Key');
            if(saved) document.getElementById(id+'Key').value = saved;
        });
        document.getElementById('openaiKey').addEventListener('change',saveAPIKeys);
        document.getElementById('geminiKey').addEventListener('change',saveAPIKeys);
        document.getElementById('sambanovaKey').addEventListener('change',saveAPIKeys);
        document.getElementById('groqKey').addEventListener('change',saveAPIKeys);
    }
    function saveAPIKeys() {
        localStorage.setItem('openaiKey', document.getElementById('openaiKey').value);
        localStorage.setItem('geminiKey', document.getElementById('geminiKey').value);
        localStorage.setItem('sambanovaKey', document.getElementById('sambanovaKey').value);
        localStorage.setItem('groqKey', document.getElementById('groqKey').value);
    }
    function getAPIKey(ai) { return document.getElementById(ai+'Key')?.value || ''; }

    function startNewChat() {
        const id = Date.now();
        sessions.push({ id, name: `Chat ${sessions.length+1}`, logs: [] });
        switchSession(id);
    }
    function switchSession(id) {
        currentSessionId = id;
        const session = sessions.find(s=>s.id===id);
        if(!session) return;
        const historyDiv = document.getElementById('chatHistory');
        historyDiv.innerHTML = '';
        if(session.logs.length===0) {
            addMessageToUI({ ai:'openai', role:'ai', content:'Ready for homework! Upload a photo or ask anything.' });
        } else {
            session.logs.forEach(msg => addMessageToUI(msg));
        }
        renderSessionList();
    }
    function handleGenerationChange(select) {
        if(select.value==='new') startNewChat();
        else if(select.value==='askAll') askAllAIs();
        select.value='';
    }

    function handleFileSelect() {
        const input = document.getElementById('mediaUpload');
        const indicator = document.getElementById('fileIndicator');
        if(input.files.length) {
            const file = input.files[0];
            if(!file.type.startsWith('image/')) {
                alert('Please select an image file.');
                input.value = '';
                return;
            }
            if(file.size>20*1024*1024) { alert('Max 20MB'); input.value=''; return; }
            currentFileName = file.name;
            const reader = new FileReader();
            reader.onload = e => {
                currentFileBase64 = e.target.result;
                currentFileType = file.type;
                indicator.style.display = 'inline-block';
                indicator.innerText = `📸 ${currentFileName.slice(0,15)}…`;
            };
            reader.readAsDataURL(file);
        } else {
            currentFileBase64 = currentFileType = currentFileName = null;
            indicator.style.display = 'none';
        }
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value;
        if(!text && !currentFileBase64) return;

        const session = sessions.find(s=>s.id===currentSessionId);
        if(!session) return;

        // If image and selected AI is Groq (text only), fallback to OpenAI or Gemini
        let aiToUse = currentAI;
        let actualAI = currentAI;
        let warningNote = '';
        if(currentFileBase64 && currentAI==='groq') {
            if(getAPIKey('openai')) {
                aiToUse = 'openai';
                actualAI = 'openai';
                warningNote = '\n\n(Image handled by OpenAI)';
            } else if(getAPIKey('gemini')) {
                aiToUse = 'gemini';
                actualAI = 'gemini';
                warningNote = '\n\n(Image handled by Gemini)';
            } else {
                alert('Groq cannot see images. Please add an OpenAI or Gemini key, or switch to a vision model.');
                return;
            }
        }

        const userMsg = { ai:currentAI, role:'user', content:text, media:currentFileBase64, mediaType:currentFileType, fileName:currentFileName };
        addMessageToUI(userMsg);
        session.logs.push(userMsg);
        if(session.logs.filter(m=>m.role==='user').length===1) {
            updateSessionName(text || currentFileName || 'photo');
        }

        input.value = '';
        document.getElementById('mediaUpload').value = '';
        document.getElementById('fileIndicator').style.display = 'none';
        const tempMedia = currentFileBase64, tempType = currentFileType;
        currentFileBase64 = currentFileType = currentFileName = null;

        showLoadingIndicator(actualAI);

        try {
            let response;
            const mode = document.getElementById('modeSelect').value;
            if(aiToUse==='openai') response = await callOpenAIVisionAPI(text, tempMedia, tempType, mode, session);
            else if(aiToUse==='gemini') response = await callGeminiAPI(text, tempMedia, tempType, mode, session);
            else if(aiToUse==='sambanova') response = await callSambanovaAPI(text, tempMedia, tempType, mode, session);
            else if(aiToUse==='groq') response = await callGroqAPI(text, mode, session);
            removeLoadingIndicator();
            if(warningNote) response += warningNote;
            const aiMsg = { ai:actualAI, role:'ai', content:response };
            addMessageToUI(aiMsg);
            session.logs.push(aiMsg);
        } catch(e) {
            removeLoadingIndicator();
            addMessageToUI({ ai:actualAI, role:'ai', content:`Error: ${e.message}` });
            console.error(e);
        }
    }

    // --- API implementations ---

    // OpenAI Vision
    async function callOpenAIVisionAPI(text, media, mediaType, mode, session) {
        const apiKey = getAPIKey('openai');
        if(!apiKey) throw new Error('OpenAI key missing');
        const model = document.getElementById('openaiModelSelect').value;

        const messages = [];
        const recent = session.logs.filter(m=>m.ai==='openai').slice(-6);
        recent.forEach(m => {
            if(m.role === 'user') {
                messages.push({ role: 'user', content: m.content });
            } else {
                messages.push({ role: 'assistant', content: m.content });
            }
        });

        const content = [];
        if(text) content.push({ type: 'text', text });
        if(media && mediaType?.startsWith('image/')) {
            content.push({ type: 'image_url', image_url: { url: media } });
        }
        if(content.length === 0) content.push({ type: 'text', text: 'What’s in this image?' });

        messages.push({ role: 'user', content });

        const payload = {
            model: model,
            messages: messages,
            max_tokens: 4096,
            temperature: mode==='creative'?0.9:mode==='fast'?0.5:0.7
        };

        const resp = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify(payload)
        });
        if(!resp.ok) {
            const err = await resp.text();
            throw new Error(`OpenAI ${resp.status}: ${err}`);
        }
        const data = await resp.json();
        return data.choices[0].message.content;
    }

    // Gemini
    async function callGeminiAPI(text, media, mediaType, mode, session) {
        const apiKey = getAPIKey('gemini');
        if(!apiKey) throw new Error('Gemini key missing');
        const { GoogleGenerativeAI } = await import('@google/generative-ai');
        const genAI = new GoogleGenerativeAI(apiKey);
        const modelName = document.getElementById('geminiModelSelect').value;
        const model = genAI.getGenerativeModel({ model: modelName });

        const history = [];
        const recent = session.logs.filter(m=>m.ai==='gemini' && m.role!=='system').slice(-10);
        for(let m of recent) {
            if(m.role==='user') {
                const parts = [];
                if(m.content) parts.push({ text:m.content });
                if(m.media && m.mediaType?.startsWith('image/')) {
                    const b64 = m.media.split(',')[1];
                    parts.push({ inlineData:{ mimeType:m.mediaType, data:b64 } });
                }
                history.push({ role:'user', parts });
            } else if(m.role==='ai') history.push({ role:'model', parts:[{ text:m.content }] });
        }

        let system = "You are a helpful assistant.";
        if(mode==='coding') system = "You are an expert software engineer.";
        if(mode==='creative') system = "You are a creative writer.";
        if(mode==='thinking') system = "Think step-by-step.";
        if(mode==='fast') system = "Be concise.";

        const currentParts = [];
        if(text) currentParts.push({ text });
        if(media && mediaType?.startsWith('image/')) {
            const b64 = media.split(',')[1];
            currentParts.push({ inlineData:{ mimeType:mediaType, data:b64 } });
        }
        if(!currentParts.length && media) currentParts.push({ text:"What's in this image?" });

        if(history.length) {
            const chat = model.startChat({ history, generationConfig:{ temperature:mode==='creative'?0.9:mode==='fast'?0.5:0.7 }, systemInstruction:{ parts:[{ text:system }] } });
            const result = await chat.sendMessage(currentParts);
            return result.response.text();
        } else {
            const result = await model.generateContent({ contents:[{ role:'user', parts:currentParts }], generationConfig:{ temperature:mode==='creative'?0.9:mode==='fast'?0.5:0.7 }, systemInstruction:{ parts:[{ text:system }] } });
            return result.response.text();
        }
    }

    // Sambanova (vision support is experimental)
    async function callSambanovaAPI(text, media, mediaType, mode, session) {
        const apiKey = getAPIKey('sambanova');
        if(!apiKey) throw new Error('Sambanova key missing');
        const model = document.getElementById('sambanovaModelSelect').value;
        const messages = [];
        const recent = session.logs.filter(m=>m.ai==='sambanova').slice(-6);
        recent.forEach(m=> messages.push({ role: m.role==='user'?'user':'assistant', content: m.content }));
        let system = "You are a helpful assistant.";
        if(mode==='coding') system = "You are an expert programmer.";
        if(mode==='creative') system = "You are a creative writer.";
        if(mode==='thinking') system = "Think step by step.";
        if(mode==='fast') system = "Be concise.";
        messages.unshift({ role:'system', content:system });

        let content;
        if (media && mediaType?.startsWith('image/')) {
            content = [
                { type: "text", text: text || "Describe this image." },
                { type: "image_url", image_url: { url: media } }
            ];
        } else {
            content = text || "Hello.";
        }

        messages.push({ role: 'user', content });

        const resp = await fetch('https://api.sambanova.ai/v1/chat/completions', {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${apiKey}` },
            body: JSON.stringify({ model, messages, max_tokens:4096, temperature: mode==='creative'?0.9:mode==='fast'?0.5:0.7 })
        });
        if(!resp.ok) throw new Error(`Sambanova ${resp.status}: ${await resp.text()}`);
        const data = await resp.json();
        return data.choices[0].message.content;
    }

    // Groq (text only)
    async function callGroqAPI(text, mode, session) {
        const apiKey = getAPIKey('groq');
        if(!apiKey) throw new Error('Groq key missing');
        const model = document.getElementById('groqModelSelect').value;
        const messages = [];
        const recent = session.logs.filter(m=>m.ai==='groq').slice(-6);
        recent.forEach(m=> messages.push({ role: m.role==='user'?'user':'assistant', content: m.content }));
        messages.push({ role:'user', content: text });
        let temp = 0.7;
        if(mode==='creative') temp=0.9; else if(mode==='fast') temp=0.5; else if(mode==='thinking') temp=0.3; else if(mode==='coding') temp=0.2;
        const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method:'POST', headers:{ 'Content-Type':'application/json', Authorization:`Bearer ${apiKey}` },
            body: JSON.stringify({ model, messages, temperature:temp, max_tokens:2048 })
        });
        if(!resp.ok) throw new Error(`Groq ${resp.status}: ${await resp.text()}`);
        const data = await resp.json();
        return data.choices[0].message.content;
    }

    // --- UI helpers ---
    function showLoadingIndicator(ai) {
        const div = document.createElement('div');
        div.className = `message ai ${ai}`;
        div.id = 'loading-indicator';
        div.innerHTML = `<div class="ai-header"><div class="ai-icon ${ai}">${ai[0].toUpperCase()}</div><div class="ai-name">${ai}</div></div><div class="typing-indicator ${ai}"><span></span><span></span><span></span></div>`;
        document.getElementById('chatHistory').appendChild(div);
        scrollToBottom();
    }
    function removeLoadingIndicator() {
        document.getElementById('loading-indicator')?.remove();
    }
    function addMessageToUI(msg) {
        const history = document.getElementById('chatHistory');
        const div = document.createElement('div');
        if(msg.role==='user') {
            div.className = 'message user';
            let html = `<div>${escapeHTML(msg.content||'')}</div>`;
            if(msg.media) {
                if(msg.mediaType?.startsWith('image/')) html = `<img src="${msg.media}" class="media-preview"><br>` + html;
                else if(msg.fileName) html = `<div><strong>📎 ${escapeHTML(msg.fileName)}</strong></div><br>` + html;
            }
            div.innerHTML = html;
        } else {
            div.className = `message ai ${msg.ai||'openai'}`;
            div.innerHTML = `<div class="ai-header"><div class="ai-icon ${msg.ai||'openai'}">${(msg.ai||'openai')[0].toUpperCase()}</div><div class="ai-name">${msg.ai||'AI'}</div></div><div>${formatMessage(msg.content||'')}</div>`;
        }
        history.appendChild(div);
        scrollToBottom();
    }
    function formatMessage(t) {
        if(!t) return '';
        t = t.replace(/```(\w*)([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
        t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
        t = t.replace(/\n/g, '<br>');
        return escapeHTML(t);
    }
    function escapeHTML(t) {
        const d = document.createElement('div');
        d.textContent = t;
        return d.innerHTML;
    }
    function scrollToBottom() {
        const el = document.getElementById('chatHistory');
        el.scrollTop = el.scrollHeight;
    }
    function updateSessionName(t) {
        const s = sessions.find(s=>s.id===currentSessionId);
        if(s) { s.name = t.length>20 ? t.slice(0,20)+'…' : t; renderSessionList(); }
    }
    function renderSessionList() {
        const list = document.getElementById('sessionList');
        list.innerHTML = '';
        sessions.slice().reverse().forEach(s => {
            const div = document.createElement('div');
            div.className = `session-item ${s.id===currentSessionId?'active':''}`;
            div.innerText = s.name;
            div.onclick = ()=>switchSession(s.id);
            list.appendChild(div);
        });
    }
    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        updatePrimaryButtonColor();
    }

    async function askAllAIs() {
        const input = document.getElementById('userInput');
        const text = input.value;
        if(!text) return;
        const originalAI = currentAI;
        const session = sessions.find(s=>s.id===currentSessionId);
        if(!session) return;
        const userMsg = { ai:'all', role:'user', content:text };
        addMessageToUI(userMsg);
        session.logs.push(userMsg);
        input.value = '';

        const ais = ['openai','gemini','sambanova','groq'];
        for(let ai of ais) {
            if(!getAPIKey(ai) && ai!=='groq') {
                addMessageToUI({ ai, role:'ai', content:`Skipped: no key for ${ai}` });
                continue;
            }
            showLoadingIndicator(ai);
            try {
                let response;
                const mode = document.getElementById('modeSelect').value;
                const tempSession = { logs: session.logs.filter(m=>m.ai===ai) };
                if(ai==='openai') response = await callOpenAIVisionAPI(text, null, null, mode, tempSession);
                else if(ai==='gemini') response = await callGeminiAPI(text, null, null, mode, tempSession);
                else if(ai==='sambanova') response = await callSambanovaAPI(text, null, null, mode, tempSession);
                else if(ai==='groq') response = await callGroqAPI(text, mode, tempSession);
                removeLoadingIndicator();
                addMessageToUI({ ai, role:'ai', content:response });
                session.logs.push({ ai, role:'ai', content:response });
            } catch(e) {
                removeLoadingIndicator();
                addMessageToUI({ ai, role:'ai', content:`Error: ${e.message}` });
            }
        }
        currentAI = originalAI;
        switchAI(originalAI);
    }

    function exportAllChats() {
        const blob = new Blob([JSON.stringify(sessions)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `chats_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }
    function importAllChats(e) {
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                sessions = JSON.parse(e.target.result);
                if(sessions.length) switchSession(sessions[0].id);
                else startNewChat();
                alert('Loaded.');
            } catch(err) { alert('Invalid file'); }
        };
        reader.readAsText(file);
    }
    function handleEnter(e) { if(e.key==='Enter') sendMessage(); }
</script>
